<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ลืมรหัสผ่าน — G-Coin Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="aurora-bg"></div><div class="aurora-orb"></div><div class="liquid-grain"></div>
<div class="auth-shell">
  <form class="glass auth-card" id="forgot-form">
    <h2>ลืมรหัสผ่าน</h2>
    <p class="auth-sub">กรอกอีเมลหรือเบอร์โทรศัพท์ที่ใช้ตอนสมัครสมาชิก เราจะส่งรหัสยืนยัน 6 หลักไปให้</p>

    <div class="field">
      <label for="identifier">อีเมล หรือ เบอร์โทรศัพท์</label>
      <input id="identifier" required placeholder="you@example.com หรือ 08xxxxxxxx" />
    </div>
    <button type="submit" class="btn btn-primary btn-block">ส่งรหัสยืนยัน</button>
    <p class="auth-switch"><a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a></p>
  </form>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const identifier = document.getElementById('identifier').value.trim();
  showOverlay('กำลังส่งรหัสยืนยัน...');
  try {
    await api('/auth/forgot-password', { method: 'POST', body: { identifier } });
    hideOverlay();
    await swalSuccess('ส่งรหัสยืนยันแล้ว', 'หากมีบัญชีที่ผูกกับข้อมูลนี้ คุณจะได้รับรหัส 6 หลักภายในไม่กี่นาที');
    location.href = `reset-password.html?identifier=${encodeURIComponent(identifier)}`;
  } catch (err) {
    hideOverlay();
    toast(err.message, 'error');
  }
});
</script>
</body>
</html>
