<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ตั้งรหัสผ่านใหม่ — G-Coin Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="aurora-bg"></div><div class="aurora-orb"></div><div class="liquid-grain"></div>
<div class="auth-shell">
  <form class="glass auth-card" id="reset-form">
    <h2>ตั้งรหัสผ่านใหม่</h2>
    <p class="auth-sub">กรอกรหัสยืนยัน 6 หลักที่ได้รับ พร้อมรหัสผ่านใหม่</p>

    <div class="field">
      <label for="identifier">อีเมล หรือ เบอร์โทรศัพท์</label>
      <input id="identifier" required />
    </div>
    <div class="field">
      <label for="code">รหัสยืนยัน 6 หลัก</label>
      <input id="code" required maxlength="6" inputmode="numeric" placeholder="000000" />
    </div>
    <div class="field">
      <label for="new_password">รหัสผ่านใหม่</label>
      <input id="new_password" type="password" required minlength="4" />
    </div>
    <button type="submit" class="btn btn-primary btn-block">ตั้งรหัสผ่านใหม่</button>
    <p class="auth-switch"><a href="forgot-password.html">ยังไม่ได้รับรหัส? ขอใหม่อีกครั้ง</a></p>
  </form>
</div>

<script src="js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('identifier')) document.getElementById('identifier').value = params.get('identifier');

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const identifier = document.getElementById('identifier').value.trim();
  const code = document.getElementById('code').value.trim();
  const new_password = document.getElementById('new_password').value;
  showOverlay('กำลังตั้งรหัสผ่านใหม่...');
  try {
    await api('/auth/reset-password', { method: 'POST', body: { identifier, code, new_password } });
    hideOverlay();
    await swalSuccess('ตั้งรหัสผ่านใหม่สำเร็จ', 'กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่');
    location.href = 'login.html';
  } catch (err) {
    hideOverlay();
    toast(err.message, 'error');
  }
});
</script>
</body>
</html>
